name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  audit:
    name: Security Audit + Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run unit tests
        run: bunx vitest run
      - name: npm audit (production, high+)
        # Uses npm even though we install with bun — npm audit reads package-lock
        # or falls back to package.json to compute advisories. High severity or
        # above fails the build; lower severities appear as annotations.
        run: |
          npm install --package-lock-only --ignore-scripts
          npm audit --omit=dev --audit-level=high
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: audit
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bunx playwright test
        env:
          CI: "true"